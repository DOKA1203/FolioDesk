<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title description">
  <title id="title">FolioDesk logo</title>
  <desc id="description">Four colorful app tiles gathered on a stack of organized desktop panels.</desc>

  <!-- Warm, editorial app-icon canvas -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="#F4F0E6"/>

  <!-- Bold print-like accents -->
  <circle cx="819" cy="237" r="87" fill="#FFD449"/>
  <circle cx="172" cy="761" r="45" fill="#FF654F"/>
  <path d="M792 799L873 718" stroke="#2257E6" stroke-width="26" stroke-linecap="round"/>
  <path d="M823 830L904 749" stroke="#2257E6" stroke-width="26" stroke-linecap="round"/>

  <!-- A flat offset shape replaces a conventional drop shadow -->
  <rect x="219" y="338" width="630" height="472" rx="94"
        fill="#15213B" opacity="0.16" transform="rotate(3 534 574)"/>

  <!-- Back panels: a visual metaphor for collected desktop items -->
  <g transform="rotate(-8 532 452)">
    <rect x="242" y="214" width="580" height="476" rx="86" fill="#2257E6"/>
  </g>

  <!-- Middle panel: coral -->
  <g transform="rotate(7 480 500)">
    <rect x="170" y="287" width="620" height="454" rx="88" fill="#FF654F"/>
  </g>

  <!-- Front collection: the organized FolioDesk surface -->
  <g>
    <rect x="182" y="378" width="660" height="430" rx="94" fill="#17213A"/>

    <!-- Four tidy app tiles -->
    <rect x="246" y="534" width="118" height="118" rx="34" fill="#F4F0E6"/>
    <path d="M282 574H328M282 594H316M282 614H326"
          stroke="#2257E6" stroke-width="12" stroke-linecap="round"/>

    <rect x="384" y="534" width="118" height="118" rx="34" fill="#FFD449"/>
    <circle cx="443" cy="593" r="29" fill="none" stroke="#17213A" stroke-width="12"/>
    <circle cx="443" cy="593" r="7" fill="#17213A"/>

    <rect x="522" y="534" width="118" height="118" rx="34" fill="#65D6C3"/>
    <path d="M557 616L581 571L605 616Z" fill="#17213A"/>

    <rect x="660" y="534" width="118" height="118" rx="34" fill="#FF654F"/>
    <path d="M694 570H744V616H694Z" fill="none" stroke="#F4F0E6" stroke-width="11" stroke-linejoin="round"/>
    <path d="M694 588H744" stroke="#F4F0E6" stroke-width="11"/>
  </g>
</svg>
