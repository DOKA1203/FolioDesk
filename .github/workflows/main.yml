name: Build & Release WPF App

on:
  push:
    tags:
      - 'v*'  # v1.0.0 같은 태그 푸시 시 실행
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example: 2.0.1). Leave empty to use the project version.'
        required: false
        type: string

permissions:
  contents: write # Release 업로드를 위해 반드시 필요

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'FolioDesk/FolioDesk.csproj'
  OUTPUT_DIR: 'publish'
  ISS_PATH: 'Installer/FolioDesk.iss'

jobs:
  build-and-release:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [ win-x64, win-arm64 ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          include-prerelease: true

      - name: Resolve application version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $version = $env:REF_NAME.TrimStart("v")
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_VERSION)) {
            $version = $env:REQUESTED_VERSION.TrimStart("v")
          }
          else {
            [xml]$project = Get-Content -Raw "${{ env.PROJECT_PATH }}"
            $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid application version: '$version'"
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved application version: $version"

      # 캐시 (속도 개선)
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      # 1. Restore (matrix 정상 참조)
      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }} --runtime ${{ matrix.runtime }}

      # 2. Build 및 Publish
      - name: Build and Publish
        shell: pwsh
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            --configuration Release `
            --runtime "${{ matrix.runtime }}" `
            --self-contained true `
            --no-restore `
            --output "${{ github.workspace }}\${{ env.OUTPUT_DIR }}\${{ matrix.runtime }}" `
            -p:Version="$env:APP_VERSION" `
            -p:InformationalVersion="$env:APP_VERSION" `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Install Inno Setup
        run: choco install innosetup --yes

      # 3. 인스톨러 빌드
      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion="$env:APP_VERSION" `
            /DRuntimeIdentifier="${{ matrix.runtime }}" `
            /DPublishDir="${{ github.workspace }}\${{ env.OUTPUT_DIR }}\${{ matrix.runtime }}" `
            /DOutputDir="${{ github.workspace }}\installer" `
            "${{ github.workspace }}\${{ env.ISS_PATH }}"

      # 4. GitHub Release 업로드
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
